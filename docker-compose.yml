services:
  ha-hearth:
    build: .
    container_name: ha-hearth
    image: ghcr.io/knowald/ha-hearth
    volumes:
      # Mount data directory for persistent dashboard configurations
      # Update this path to your desired data directory
      - ${DATA_PATH:-./data}:/app/data
    networks:
      - ha-hearth-network
    ports:
      - '${EXPOSED_PORT:-5050}:5050'
    environment:
      TZ: ${TZ:-UTC}
      HASS_URL: ${HASS_URL}
      HASS_PUBLIC_URL: ${HASS_PUBLIC_URL:-}
      PORT: 5050
      NODE_ENV: production
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:5050']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ha-hearth-network:
    driver: bridge
